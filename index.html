<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wattle — design system</title>
<meta name="description" content="Wattle is a warm, earthy design system based on the Yellow-wattled Lapwing: colour tokens, type, spacing, a brand book and React components.">
<link rel="icon" href="assets/Logos/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/Logos/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/Logos/apple-touch-icon.png">
<link rel="stylesheet" href="components/bundle.css">
<style id="tokens-css"></style>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--surface-100); color: var(--ink); font-family: var(--font-sans); font-size: 16px; line-height: 24px; }
  a { color: var(--ink); text-underline-offset: 3px; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 var(--space-6); }
  header.top { position: sticky; top: 0; z-index: 2; background: var(--surface-100); border-bottom: 1px solid var(--hairline); }
  header.top .wrap { display: flex; align-items: center; gap: var(--space-6); height: 64px; }
  .brand { font-family: var(--font-display); font-weight: 600; font-size: 24px; text-decoration: none; }
  nav { display: flex; gap: var(--space-4); flex: 1; overflow-x: auto; }
  nav a { font-size: 14px; font-weight: 600; color: var(--ink-muted); text-decoration: none; white-space: nowrap; }
  nav a:hover { color: var(--ink); }
  section.block { scroll-margin-top: 72px; padding: var(--space-10) 0; border-bottom: 1px solid var(--hairline); }
  h2.sec { font-family: var(--font-display); font-weight: 600; font-size: 36px; line-height: 42px; margin: 0 0 var(--space-6); letter-spacing: -0.01em; }
  .muted { color: var(--ink-muted); }
  .cover-box { margin-top: var(--space-6); border: 1px solid var(--hairline); border-radius: var(--radius-md); overflow: hidden; background: var(--surface-100); }
  .cover-box iframe { display: block; width: 960px; height: 300px; border: 0; transform-origin: 0 0; }
  .prose { max-width: 720px; }
  .prose h1 { display: none; }
  .prose h2 { font-family: var(--font-display); font-weight: 600; font-size: 28px; line-height: 34px; margin: var(--space-10) 0 var(--space-2); }
  .prose h3 { font-family: var(--font-display); font-weight: 600; font-size: 20px; line-height: 26px; margin: var(--space-6) 0 var(--space-2); }
  .prose p, .prose li { color: var(--ink); }
  .prose code { font-size: 0.9em; background: var(--surface-200); border: 1px solid var(--hairline); border-radius: 4px; padding: 0 4px; }
  .prose table { border-collapse: collapse; width: 100%; font-size: 15px; }
  .prose th, .prose td { text-align: left; padding: var(--space-2); border-bottom: 1px solid var(--hairline); }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-4); }
  .swatch { border: 1px solid var(--hairline); border-radius: var(--radius-md); overflow: hidden; background: var(--surface-200); }
  .swatch .chip { height: 88px; border-bottom: 1px solid var(--hairline); }
  .swatch .meta { padding: var(--space-4); }
  .swatch .name { font-weight: 700; }
  .swatch .val { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--ink-muted); }
  .swatch .use { font-size: 13px; line-height: 18px; color: var(--ink-muted); margin-top: var(--space-2); }
  .typerow { display: grid; grid-template-columns: 160px 1fr; gap: var(--space-4); align-items: baseline; padding: var(--space-4) 0; border-bottom: 1px solid var(--hairline); }
  .typerow .spec { font-size: 13px; line-height: 18px; color: var(--ink-muted); }
  .scale { display: flex; flex-direction: column; gap: var(--space-2); }
  .scalerow { display: grid; grid-template-columns: 120px 64px 1fr; gap: var(--space-4); align-items: center; font-size: 14px; }
  .bar { height: 16px; background: var(--earth); border-radius: 2px; }
  .radii { display: flex; gap: var(--space-6); flex-wrap: wrap; }
  .radius { width: 120px; text-align: center; font-size: 14px; }
  .radius .shape { width: 120px; height: 80px; background: var(--taupe); margin-bottom: var(--space-2); }
  .shadows { display: flex; gap: var(--space-10); flex-wrap: wrap; padding: var(--space-4) 0; }
  .shadow { width: 220px; }
  .shadow .layer { height: 96px; background: var(--surface-200); border: 1px solid var(--hairline); border-radius: var(--radius-md); margin-bottom: var(--space-4); }
  .shadow .use { font-size: 13px; line-height: 18px; color: var(--ink-muted); }
  .brand img { display: block; height: 28px; width: auto; }
  .agroup { margin-bottom: var(--space-10); }
  .agroup h3 { font-family: var(--font-display); font-size: 24px; line-height: 30px; margin: 0 0 var(--space-4); }
  .tiles { display: grid; gap: var(--space-4); }
  .tiles.l { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .tiles.xs { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  .tile { border: 1px solid var(--hairline); border-radius: var(--radius-md); background: var(--surface-200); overflow: hidden; text-decoration: none; color: var(--ink); }
  .tile .pic { display: flex; align-items: center; justify-content: center; height: 120px; padding: var(--space-4); background: #F7F4EC; }
  .tile.dark .pic { background: #1A1816; }
  .tiles.xs .pic { height: 72px; }
  .tile .pic img { max-width: 100%; max-height: 100%; }
  .tiles.xs .pic img { width: 24px; height: 24px; }
  .tile .cap { font-size: 12px; line-height: 16px; padding: var(--space-2); color: var(--ink-muted); word-break: break-all; }
  .comp { border: 1px solid var(--hairline); border-radius: var(--radius-md); overflow: hidden; margin-bottom: var(--space-6); background: var(--surface-200); }
  .comp-head { padding: var(--space-4); border-bottom: 1px solid var(--hairline); }
  .comp-head h3 { margin: 0; font-family: var(--font-display); font-size: 24px; line-height: 30px; }
  .comp iframe { display: block; width: 100%; border: 0; background: var(--surface-100); }
  .comp details { border-top: 1px solid var(--hairline); padding: var(--space-4); }
  .comp summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  footer { padding: var(--space-10) 0; font-size: 14px; color: var(--ink-muted); }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#" aria-label="Wattle"><img id="brand-logo" src="assets/Logos/wattle-lockup.svg" alt="Wattle" height="28"></a>
    <nav aria-label="Sections">
      <a href="#brand-book">Brand book</a>
      <a href="#colours">Colours</a>
      <a href="#type">Type</a>
      <a href="#space">Space &amp; shape</a>
      <a href="#components">Components</a>
      <a href="#assets">Assets</a>
    </nav>
    <button id="theme" class="wt-btn wt-btn-secondary wt-btn-sm" type="button" aria-pressed="false">Dark theme</button>
  </div>
</header>

<main class="wrap">
  <div class="cover-box" id="cover-box"><iframe id="cover" title="Wattle cover" scrolling="no"></iframe></div>
  <section class="block" id="brand-book"><h2 class="sec">Brand book</h2><div class="prose" id="readme"></div></section>
  <section class="block" id="colours"><h2 class="sec">Colours</h2><div class="swatches" id="swatches"></div></section>
  <section class="block" id="type"><h2 class="sec">Type</h2><div id="typestyles"></div></section>
  <section class="block" id="space"><h2 class="sec">Space &amp; shape</h2>
    <h3 class="muted">Spacing</h3><div class="scale" id="spacing"></div>
    <h3 class="muted" style="margin-top:var(--space-10)">Radius</h3><div class="radii" id="radii"></div>
    <h3 class="muted" style="margin-top:var(--space-10)">Elevation</h3><p class="muted" id="shadow-note"></p><div class="shadows" id="shadows"></div>
  </section>
  <section class="block" id="components"><h2 class="sec">Components</h2><div id="comps"></div></section>
  <section class="block" id="assets"><h2 class="sec">Assets</h2><div id="asset-groups"></div></section>
  <footer>Generated live from <code>tokens.json</code>, <code>README.md</code> and <code>components/</code> in this repository.</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function () {
  var COMPONENTS = ['Button', 'ActionButton', 'ProgressButton', 'HoldButton', 'UndoButton', 'ReactionButton', 'Input', 'Card', 'Badge', 'Icon'];
  var REACT = 'https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js';
  var REACT_DOM = 'https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js';
  var base = new URL('.', location.href).href;
  var tokens, theme = 'light', previews = {};

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function val(v) { var m = /^\{(.+)\}$/.exec(v); return m ? 'var(--' + m[1] + ')' : v; }
  function themeValue(t, id) { return typeof t.value === 'string' ? t.value : (t.value[id] || t.value[tokens.color.themes[0].id]); }

  function tokensCss() {
    var themes = tokens.color.themes, out = '';
    themes.forEach(function (th, i) {
      out += (i === 0 ? ':root, ' : '') + '[data-theme="' + th.id + '"] {';
      tokens.color.tokens.forEach(function (t) { out += '--' + t.name + ':' + val(themeValue(t, th.id)) + ';'; });
      (tokens.shadow ? tokens.shadow.tokens : []).forEach(function (t) { out += '--' + t.name + ':' + themeValue(t, th.id) + ';'; });
      out += '}\n';
    });
    out += ':root {';
    ['spacing', 'radius'].forEach(function (f) { (tokens[f] ? tokens[f].tokens : []).forEach(function (t) { out += '--' + t.name + ':' + t.value + ';'; }); });
    Object.keys(tokens.type.families).forEach(function (k) { out += '--font-' + k + ':' + tokens.type.families[k] + ';'; });
    out += '}\n';
    tokens.type.groups.forEach(function (g) {
      g.styles.forEach(function (s) {
        out += '.' + s.name + '{font-family:var(--font-' + (s.family || g.family) + ');font-size:' + s.fontSize + ';line-height:' + s.lineHeight + ';font-weight:' + s.fontWeight + (s.letterSpacing ? ';letter-spacing:' + s.letterSpacing : '') + '}\n';
      });
    });
    return out;
  }

  function srcdoc(html) {
    html = html.replace(/^<!--\s*@dsCard[^>]*-->\s*/, '');
    var head = '<style>' + tokensCss() + '</style>' +
      '<link rel="stylesheet" href="' + base + 'components/bundle.css">' +
      '<script src="' + REACT + '"><\/script><script src="' + REACT_DOM + '"><\/script>' +
      '<script src="' + base + 'components/bundle.js"><\/script>';
    html = html.replace(/<html[^>]*>/i, '<html data-theme="' + theme + '">');
    return html.replace(/<head>/i, '<head>' + head);
  }

  function marker(html) {
    var m = /^<!--\s*@dsCard([^>]*)-->/.exec(html), h = 120;
    if (m) { var hm = /height=(\d+)/.exec(m[1]); if (hm) h = +hm[1]; }
    return h;
  }

  function renderFrames() {
    document.getElementById('cover').srcdoc = srcdoc(previews.Cover);
    COMPONENTS.forEach(function (c) { var f = document.getElementById('frame-' + c); if (f) f.srcdoc = srcdoc(previews[c]); });
  }

  function fitCover() {
    var box = document.getElementById('cover-box'), f = document.getElementById('cover');
    var s = Math.min(1, box.clientWidth / 960);
    f.style.transform = 'scale(' + s + ')';
    box.style.height = (300 * s) + 'px';
  }

  function renderStatic() {
    document.getElementById('tokens-css').textContent = tokensCss();
    var sw = document.getElementById('swatches');
    sw.innerHTML = tokens.color.tokens.map(function (t) {
      var vals = tokens.color.themes.map(function (th) { return th.name + ' ' + themeValue(t, th.id); }).join(' · ');
      return '<div class="swatch"><div class="chip" style="background:var(--' + esc(t.name) + ')"></div><div class="meta"><div class="name">' + esc(t.name) +
        '</div><div class="val">' + esc(vals) + '</div><div class="use">' + esc(t.usage || '') + '</div></div></div>';
    }).join('');
    document.getElementById('typestyles').innerHTML = tokens.type.groups.map(function (g) {
      return g.styles.map(function (s) {
        return '<div class="typerow"><div><strong>' + esc(s.name) + '</strong><div class="spec">' + esc(s.fontSize + ' / ' + s.lineHeight + ' · ' + s.fontWeight) +
          '</div></div><div><div class="' + esc(s.name) + '">' + esc(s.sample || 'Warm earth, one sharp yellow') + '</div><div class="spec">' + esc(s.usage || '') + '</div></div></div>';
      }).join('');
    }).join('');
    document.getElementById('spacing').innerHTML = tokens.spacing.tokens.map(function (t) {
      return '<div class="scalerow"><strong>' + esc(t.name) + '</strong><span class="muted">' + esc(t.value) + '</span><div><div class="bar" style="width:' + esc(t.value) + '"></div></div></div>';
    }).join('');
    var sh = tokens.shadow || { tokens: [] };
    document.getElementById('shadow-note').textContent = sh.note || '';
    document.getElementById('shadows').innerHTML = sh.tokens.map(function (t) {
      return '<div class="shadow"><div class="layer" style="box-shadow:var(--' + esc(t.name) + ')"></div><strong>' + esc(t.name) + '</strong><div class="use">' + esc(t.usage || '') + '</div></div>';
    }).join('');
    document.getElementById('radii').innerHTML = tokens.radius.tokens.map(function (t) {
      return '<div class="radius"><div class="shape" style="border-radius:' + esc(t.value) + '"></div><strong>' + esc(t.name) + '</strong><div class="muted">' + esc(t.value) + '</div></div>';
    }).join('');
  }

  function renderAssets(ix) {
    var groups = ix.groups || Object.keys(ix.assetGroups || {});
    document.getElementById('asset-groups').innerHTML = groups.map(function (g) {
      var G = ix.assetGroups[g]; if (!G) return '';
      return '<div class="agroup"><h3>' + esc(G.name) + '</h3><div class="tiles ' + esc(G.tile || 'l') + '">' + (G.order || []).map(function (n) {
        var url = 'assets/' + encodeURIComponent(g) + '/' + n.split('/').map(encodeURIComponent).join('/');
        return '<a class="tile' + (/-dark\./.test(n) ? ' dark' : '') + '" href="' + url + '" download><div class="pic"><img src="' + url + '" alt="' + esc(n) + '" loading="lazy"></div><div class="cap">' + esc(n) + '</div></a>';
      }).join('') + '</div></div>';
    }).join('');
  }

  function get(p) { return fetch(p, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(p + ' ' + r.status); return r.text(); }); }

  get('design-system.json').then(function (t) { renderAssets(JSON.parse(t)); }).catch(function () {});
  Promise.all([get('tokens.json'), get('README.md'), get('components/Cover/preview.html')]
    .concat(COMPONENTS.map(function (c) { return get('components/' + c + '/preview.html'); }))
    .concat(COMPONENTS.map(function (c) { return get('components/' + c + '/README.md'); })))
  .then(function (r) {
    tokens = JSON.parse(r[0]);
    document.getElementById('readme').innerHTML = marked.parse(r[1]);
    previews.Cover = r[2];
    var n = COMPONENTS.length;
    document.getElementById('comps').innerHTML = COMPONENTS.map(function (c, i) {
      previews[c] = r[3 + i];
      return '<div class="comp"><div class="comp-head"><h3>' + c + '</h3></div><iframe id="frame-' + c + '" title="' + c + ' preview" style="height:' + marker(previews[c]) +
        'px"></iframe><details><summary>Guidelines</summary><div class="prose">' + marked.parse(r[3 + n + i]) + '</div></details></div>';
    }).join('');
    renderStatic(); renderFrames(); fitCover();
  }).catch(function (e) { document.getElementById('readme').textContent = 'Could not load the design system: ' + e.message; });

  window.addEventListener('resize', fitCover);
  document.getElementById('theme').addEventListener('click', function (e) {
    theme = theme === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
    e.currentTarget.setAttribute('aria-pressed', String(theme === 'dark'));
    e.currentTarget.textContent = theme === 'light' ? 'Dark theme' : 'Light theme';
    document.getElementById('brand-logo').src = theme === 'dark' ? 'assets/Logos/wattle-lockup-dark.svg' : 'assets/Logos/wattle-lockup.svg';
    renderFrames();
  });
})();
</script>
</body>
</html>
