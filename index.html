<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wattle — design system</title>
<meta name="description" content="Wattle is a warm, earthy design system based on the Yellow-wattled Lapwing: colour tokens, type, spacing, a brand book and React components.">
<link rel="icon" href="assets/Logos/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/Logos/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/Logos/apple-touch-icon.png">
<link rel="stylesheet" href="components/bundle.css">
<style id="tokens-css"></style>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--surface-100); color: var(--ink); font-family: var(--font-sans); font-size: 16px; line-height: 24px; }
  a { color: var(--ink); text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  main:focus, main:focus-visible { outline: none; }

  /* shell */
  .topbar { position: sticky; top: 0; z-index: 20; height: 60px; display: flex; align-items: center; gap: var(--space-4); padding: 0 var(--space-6); background: var(--surface-100); border-bottom: 1px solid var(--hairline); }
  .brand { display: flex; align-items: center; text-decoration: none; }
  .brand img { display: block; height: 26px; width: auto; }
  .topbar .spacer { flex: 1; }
  .menu-btn { display: none; }
  .shell { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: calc(100vh - 60px); }
  .side { position: sticky; top: 60px; height: calc(100vh - 60px); overflow-y: auto; padding: var(--space-4) var(--space-4) var(--space-10); border-right: 1px solid var(--hairline); }
  .search { width: 100%; margin-bottom: var(--space-4); }
  .nav-group { margin-bottom: var(--space-4); }
  .nav-title { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
  .nav-title span { font-weight: 600; letter-spacing: 0; }
  .nav-link { display: flex; align-items: center; gap: var(--space-2); padding: 6px 10px; border-radius: var(--radius-sm); font-size: 14px; line-height: 20px; font-weight: 500; color: var(--ink); text-decoration: none; }
  .nav-link:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .nav-link.is-active { background: var(--surface-200); box-shadow: inset 0 0 0 1px var(--hairline); font-weight: 700; }
  .nav-link.is-active::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); margin-left: -2px; }
  .nav-empty { padding: 6px 10px; font-size: 13px; color: var(--ink-muted); }
  main { min-width: 0; padding: var(--space-10) var(--space-10) 80px; }
  .page { max-width: 960px; margin: 0 auto; }

  /* page parts */
  .crumb { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: var(--space-2); }
  h1.title { margin: 0 0 var(--space-2); font-family: var(--font-display); font-weight: 600; font-size: 44px; line-height: 50px; letter-spacing: -0.01em; }
  .lede { margin: 0 0 var(--space-6); max-width: 680px; font-size: 18px; line-height: 28px; color: var(--ink-muted); }
  h2.sec { margin: var(--space-10) 0 var(--space-4); font-family: var(--font-display); font-weight: 600; font-size: 26px; line-height: 32px; }
  .muted { color: var(--ink-muted); }
  .prose { max-width: 720px; }
  .prose h1 { display: none; }
  .prose h2 { font-family: var(--font-display); font-weight: 600; font-size: 26px; line-height: 32px; margin: var(--space-10) 0 var(--space-2); scroll-margin-top: 80px; }
  .prose h3 { font-family: var(--font-display); font-weight: 600; font-size: 20px; line-height: 26px; margin: var(--space-6) 0 var(--space-2); }
  .prose code { font-size: .9em; background: var(--surface-200); border: 1px solid var(--hairline); border-radius: 4px; padding: 0 4px; }
  .prose pre { background: var(--surface-200); border: 1px solid var(--hairline); border-radius: var(--radius-sm); padding: var(--space-4); overflow-x: auto; }
  .prose pre code { border: 0; padding: 0; background: none; }
  .prose table { border-collapse: collapse; width: 100%; font-size: 15px; }
  .prose th, .prose td { text-align: left; vertical-align: top; padding: var(--space-2); border-bottom: 1px solid var(--hairline); }
  .toc { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--space-6); }

  .cover-box { border: 1px solid var(--hairline); border-radius: var(--radius-md); overflow: hidden; background: var(--surface-100); margin-bottom: var(--space-6); }
  .cover-box iframe { display: block; width: 960px; height: 300px; border: 0; transform-origin: 0 0; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: var(--space-4); }
  .tile-count { font-family: var(--font-display); font-size: 28px; line-height: 32px; font-weight: 600; color: var(--ink); }

  .stage { border: 1px solid var(--hairline); border-radius: var(--radius-md); overflow: hidden; background: var(--surface-100); }
  .stage iframe { display: block; width: 100%; border: 0; background: var(--surface-100); }
  .stage-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); padding: 6px 6px 6px 14px; border-bottom: 1px solid var(--hairline); background: var(--surface-200); font-size: 13px; color: var(--ink-muted); }
  .pager { display: flex; justify-content: space-between; gap: var(--space-4); margin-top: var(--space-10); padding-top: var(--space-6); border-top: 1px solid var(--hairline); }
  .pager a { display: flex; flex-direction: column; gap: 2px; text-decoration: none; padding: var(--space-2) 0; }
  .pager a span { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
  .pager a b { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
  .pager a:hover b { text-decoration: underline; text-underline-offset: 4px; }
  .pager .next { margin-left: auto; text-align: right; }

  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-4); }
  .swatch { border: 1px solid var(--hairline); border-radius: var(--radius-md); overflow: hidden; background: var(--surface-200); }
  .swatch .chip { height: 80px; border-bottom: 1px solid var(--hairline); }
  .swatch .meta { padding: var(--space-4); display: flex; flex-direction: column; gap: 4px; }
  .swatch .val { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--ink-muted); }
  .swatch .use { font-size: 13px; line-height: 18px; color: var(--ink-muted); }
  .typerow { display: grid; grid-template-columns: 170px 1fr; gap: var(--space-4); align-items: baseline; padding: var(--space-4) 0; border-bottom: 1px solid var(--hairline); }
  .spec { font-size: 13px; line-height: 18px; color: var(--ink-muted); }
  .scalerow { display: grid; grid-template-columns: 120px 64px 1fr; gap: var(--space-4); align-items: center; font-size: 14px; padding: 6px 0; }
  .bar { height: 16px; background: var(--earth); border-radius: 2px; }
  .radii, .shadows { display: flex; gap: var(--space-6); flex-wrap: wrap; }
  .radius { width: 140px; font-size: 14px; }
  .radius .shape { width: 140px; height: 88px; background: var(--taupe); margin-bottom: var(--space-2); }
  .shadow { width: 240px; font-size: 14px; }
  .shadow .layer { height: 96px; background: var(--surface-200); border: 1px solid var(--hairline); border-radius: var(--radius-md); margin-bottom: var(--space-4); }
  .agroup { margin-bottom: var(--space-10); }
  .atiles { display: grid; gap: var(--space-4); }
  .atiles.l { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .atiles.xs { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
  .atile { border: 1px solid var(--hairline); border-radius: var(--radius-md); background: var(--surface-200); overflow: hidden; text-decoration: none; color: var(--ink); }
  .atile .pic { display: flex; align-items: center; justify-content: center; height: 112px; padding: var(--space-4); background: #F7F4EC; }
  .atile.dark .pic { background: #1A1816; }
  .atiles.xs .pic { height: 68px; }
  .atile .pic img { max-width: 100%; max-height: 100%; }
  .atiles.xs .pic img { width: 24px; height: 24px; }
  .atile .cap { font-size: 12px; line-height: 16px; padding: var(--space-2); color: var(--ink-muted); overflow-wrap: anywhere; }
  .loading { padding: var(--space-10) 0; color: var(--ink-muted); }

  @media (max-width: 860px) {
    .menu-btn { display: inline-flex; }
    .gh-link { display: none; }
    .topbar { padding: 0 var(--space-4); gap: var(--space-2); }
    .shell { grid-template-columns: 1fr; }
    .side { position: fixed; top: 60px; left: 0; bottom: 0; height: auto; width: 290px; z-index: 15; background: var(--surface-100); transform: translateX(-100%); transition: transform 220ms ease; box-shadow: var(--shadow-overlay); }
    body.nav-open .side { transform: none; }
    main { padding: var(--space-6) var(--space-4) 64px; }
    h1.title { font-size: 34px; line-height: 40px; }
    .typerow { grid-template-columns: 1fr; gap: 4px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <button class="wt-btn wt-btn-ghost wt-btn-icon menu-btn" type="button" id="menu-btn" aria-label="Open navigation" aria-expanded="false" aria-controls="side"></button>
  <a class="brand" href="#/" aria-label="Wattle home"><img id="brand-logo" src="assets/Logos/wattle-lockup.svg" alt="Wattle" height="26"></a>
  <span class="spacer"></span>
  <a class="wt-btn wt-btn-ghost wt-btn-sm gh-link" href="https://github.com/bharathwaaj/wattle">GitHub</a>
  <button id="theme" class="wt-btn wt-btn-secondary wt-btn-sm" type="button" aria-pressed="false">Dark theme</button>
</header>

<div class="shell">
  <nav class="side" id="side" aria-label="Design system">
    <input class="wt-input search" id="search" type="search" placeholder="Search  ( / )" aria-label="Search components and pages">
    <div id="nav"></div>
  </nav>
  <main id="main" tabindex="-1"><div class="page loading">Loading Wattle…</div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function () {
  var REACT = 'https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js';
  var REACT_DOM = 'https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js';
  var GROUP_ORDER = ['Actions', 'Motion', 'Forms', 'Navigation', 'Overlays', 'Layout', 'Status', 'Building blocks', 'Media'];
  var base = new URL('.', location.href).href;
  var theme = 'light';
  var V = '';                       // cache-buster, from design-system.json lastChange
  var data = { tokens: null, readme: '', index: null, comps: [], previews: {}, guides: {} };
  var cache = {};

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function get(p) {
    if (cache[p]) return cache[p];
    cache[p] = fetch(p + (V ? (p.indexOf('?') < 0 ? '?v=' : '&v=') + V : ''), { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(p + ' ' + r.status); return r.text(); });
    return cache[p];
  }
  function val(v) { var m = /^\{(.+)\}$/.exec(v); return m ? 'var(--' + m[1] + ')' : v; }
  function tv(t, id) { return typeof t.value === 'string' ? t.value : (t.value[id] || t.value[data.tokens.color.themes[0].id]); }

  function tokensCss() {
    var T = data.tokens, out = '';
    T.color.themes.forEach(function (th, i) {
      out += (i === 0 ? ':root, ' : '') + '[data-theme="' + th.id + '"] {';
      T.color.tokens.forEach(function (t) { out += '--' + t.name + ':' + val(tv(t, th.id)) + ';'; });
      (T.shadow ? T.shadow.tokens : []).forEach(function (t) { out += '--' + t.name + ':' + tv(t, th.id) + ';'; });
      out += '}\n';
    });
    out += ':root {';
    ['spacing', 'radius'].forEach(function (f) { (T[f] ? T[f].tokens : []).forEach(function (t) { out += '--' + t.name + ':' + t.value + ';'; }); });
    Object.keys(T.type.families).forEach(function (k) { out += '--font-' + k + ':' + T.type.families[k] + ';'; });
    out += '}\n';
    T.type.groups.forEach(function (g) { g.styles.forEach(function (s) {
      out += '.' + s.name + '{font-family:var(--font-' + (s.family || g.family) + ');font-size:' + s.fontSize + ';line-height:' + s.lineHeight + ';font-weight:' + s.fontWeight + (s.letterSpacing ? ';letter-spacing:' + s.letterSpacing : '') + '}\n';
    }); });
    return out;
  }
  function marker(html) {
    var m = /^<!--\s*@dsCard([^>]*)-->/.exec(html) || ['', ''], a = m[1];
    function attr(n) { var r = new RegExp(n + '=(?:"([^"]*)"|(\\d+))').exec(a); return r ? (r[1] !== undefined ? r[1] : r[2]) : null; }
    return { group: attr('group'), height: +(attr('height') || 120), width: attr('width') ? +attr('width') : null, subtitle: attr('subtitle') };
  }
  function srcdoc(html) {
    html = html.replace(/^<!--\s*@dsCard[^>]*-->\s*/, '');
    var q = V ? '?v=' + V : '';
    var head = '<style>' + tokensCss() + '</style><link rel="stylesheet" href="' + base + 'components/bundle.css' + q + '">' +
      '<script src="' + REACT + '"><\/script><script src="' + REACT_DOM + '"><\/script><script src="' + base + 'components/bundle.js' + q + '"><\/script>';
    html = html.replace(/<html[^>]*>/i, '<html data-theme="' + theme + '">');
    return html.replace(/<head>/i, '<head>' + head);
  }
  function summary(md) {
    var body = md.replace(/^#.*\n+/, '').trim();
    var para = body.split(/\n\s*\n/)[0] || '';
    return para.replace(/\s+/g, ' ');
  }
  function mdInline(s) { return marked.parseInline(s || ''); }

  /* ---------- navigation model ---------- */
  var FOUNDATIONS = [
    { id: 'brand', label: 'Brand book' }, { id: 'colours', label: 'Colours' }, { id: 'type', label: 'Type' },
    { id: 'space', label: 'Space, shape & elevation' }, { id: 'assets', label: 'Logos & icons' }];
  function groups() {
    var g = {};
    data.comps.forEach(function (c) { var k = c.group || 'Other'; (g[k] = g[k] || []).push(c); });
    var keys = Object.keys(g).sort(function (a, b) {
      var ia = GROUP_ORDER.indexOf(a), ib = GROUP_ORDER.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
    });
    return keys.map(function (k) { return { name: k, items: g[k] }; });
  }
  function flatPages() {
    var list = [{ route: '/', label: 'Overview', section: 'Start' }, { route: '/start', label: 'Using Wattle', section: 'Start' }];
    FOUNDATIONS.forEach(function (f) { list.push({ route: '/' + f.id, label: f.label, section: 'Foundations' }); });
    groups().forEach(function (g) { g.items.forEach(function (c) { list.push({ route: '/c/' + c.name, label: c.name, section: g.name }); }); });
    return list;
  }

  function renderNav() {
    var q = document.getElementById('search').value.trim().toLowerCase();
    var route = currentRoute();
    var html = '';
    function link(r, label, extra) {
      return '<a class="nav-link' + (r === route ? ' is-active' : '') + '" href="#' + r + '"' + (r === route ? ' aria-current="page"' : '') + '>' + esc(label) + (extra || '') + '</a>';
    }
    function match(label, sub) { return !q || label.toLowerCase().indexOf(q) >= 0 || (sub || '').toLowerCase().indexOf(q) >= 0; }
    var start = [['/', 'Overview'], ['/start', 'Using Wattle']].filter(function (x) { return match(x[1]); });
    if (start.length) html += '<div class="nav-group"><div class="nav-title">Start</div>' + start.map(function (x) { return link(x[0], x[1]); }).join('') + '</div>';
    var f = FOUNDATIONS.filter(function (x) { return match(x.label); });
    if (f.length) html += '<div class="nav-group"><div class="nav-title">Foundations</div>' + f.map(function (x) { return link('/' + x.id, x.label); }).join('') + '</div>';
    var any = start.length || f.length;
    groups().forEach(function (g) {
      var items = g.items.filter(function (c) { return match(c.name, g.name + ' ' + (c.subtitle || '')); });
      if (!items.length) return;
      any = true;
      html += '<div class="nav-group"><div class="nav-title">' + esc(g.name) + '<span>' + items.length + '</span></div>' + items.map(function (c) { return link('/c/' + c.name, c.name); }).join('') + '</div>';
    });
    if (!any) html = '<div class="nav-empty">Nothing matches “' + esc(q) + '”.</div>';
    document.getElementById('nav').innerHTML = html;
  }

  /* ---------- pages ---------- */
  function pager(route) {
    var list = flatPages(), i = list.map(function (p) { return p.route; }).indexOf(route);
    if (i < 0) return '';
    var prev = list[i - 1], next = list[i + 1];
    return '<nav class="pager" aria-label="Previous and next">' +
      (prev ? '<a href="#' + prev.route + '"><span>Previous</span><b>← ' + esc(prev.label) + '</b></a>' : '') +
      (next ? '<a class="next" href="#' + next.route + '"><span>Next</span><b>' + esc(next.label) + ' →</b></a>' : '') + '</nav>';
  }
  function head(crumb, title, lede) {
    return '<div class="crumb">' + esc(crumb) + '</div><h1 class="title">' + esc(title) + '</h1>' + (lede ? '<p class="lede">' + lede + '</p>' : '');
  }

  function pageOverview() {
    var g = groups();
    var intro = summary(data.readme);
    var tiles = '<a class="wt-card" href="#/brand"><span class="wt-card-eyebrow">Foundations</span><h3 class="wt-card-title">Brand book</h3><div class="wt-card-body">Voice, colour rules, type, space and shape.</div></a>' +
      '<a class="wt-card" href="#/colours"><span class="wt-card-eyebrow">Foundations</span><div class="tile-count">' + data.tokens.color.tokens.length + '</div><div class="wt-card-body">colour tokens, light and dark</div></a>' +
      g.map(function (x) {
        return '<a class="wt-card" href="#/c/' + x.items[0].name + '"><span class="wt-card-eyebrow">' + esc(x.name) + '</span><div class="tile-count">' + x.items.length + '</div><div class="wt-card-body">' + esc(x.items.map(function (c) { return c.name; }).join(', ')) + '</div></a>';
      }).join('');
    return head('Wattle', 'A design system after the Yellow-wattled Lapwing', mdInline(intro)) +
      '<div class="cover-box" id="cover-box"><iframe id="cover" title="Wattle cover" scrolling="no"></iframe></div>' +
      '<h2 class="sec">Browse</h2><div class="tiles">' + tiles + '</div>' + pager('/');
  }

  function pageStart() {
    var code = function (s) { return '<pre><code>' + esc(s) + '</code></pre>'; };
    return head('Start', 'Using Wattle', 'Wattle is plain files: a stylesheet, one script and the tokens. There is no build step.') +
      '<div class="prose">' +
      '<h2>1. Add the tokens</h2><p>Every colour, space, radius and shadow is a CSS custom property generated from <code>tokens.json</code>. Copy this into your stylesheet:</p>' +
      '<div class="stage"><div class="stage-bar"><span>tokens.css</span><button class="wt-btn wt-btn-ghost wt-btn-sm" type="button" id="copy-tokens">Copy</button></div><pre style="margin:0;border:0;border-radius:0;max-height:260px"><code id="tokens-code">' + esc(tokensCss()) + '</code></pre></div>' +
      '<h2>2. Load the styles and scripts</h2><p>React 18 comes first, then the Wattle bundle. The stylesheet also loads Fraunces and Manrope from Google Fonts.</p>' +
      code('<link rel="stylesheet" href="' + base + 'components/bundle.css">\n<script src="' + REACT + '"><\/script>\n<script src="' + REACT_DOM + '"><\/script>\n<script src="' + base + 'components/bundle.js"><\/script>') +
      '<h2>3. Use the components</h2><p>Everything is on <code>window.Wattle</code>.</p>' +
      code('const { Button, Card, ActionButton } = window.Wattle;\n\n<Card eyebrow="Course" title="Organic Chemistry">\n  <ActionButton label="Book" icon="plus" doneLabel="Booked" undoable />\n</Card>') +
      '<h2>4. Pick a theme</h2><p>Put <code>data-theme="light"</code> or <code>data-theme="dark"</code> on <code>&lt;html&gt;</code>. Every component follows it.</p>' +
      '<h2>5. Follow the brand book</h2><p>The <a href="#/brand">brand book</a> sets the rules: one yellow per view, borders instead of shadows, and status shown in words. Each component page has its own guidelines.</p>' +
      '<p class="muted">Types for every component are in <a href="' + base + 'components/index.d.ts">components/index.d.ts</a>.</p></div>' + pager('/start');
  }

  function pageBrand() {
    var html = marked.parse(data.readme);
    var toc = (data.readme.match(/^## .+$/gm) || []).map(function (h2) { var t = h2.slice(3); return '<a class="wt-tag wt-tag-toggle" href="#/brand" data-jump="' + esc(t) + '">' + esc(t) + '</a>'; }).join('');
    return head('Foundations', 'Brand book', '') + '<div class="toc">' + toc + '</div><div class="prose" id="brand-prose">' + html + '</div>' + pager('/brand');
  }

  function pageColours() {
    var T = data.tokens;
    return head('Foundations', 'Colours', 'Twelve tokens drawn from the bird. Switch the theme in the top bar to see the dark values.') +
      '<div class="swatches">' + T.color.tokens.map(function (t) {
        var vals = T.color.themes.map(function (th) { return th.name + ' ' + tv(t, th.id); }).join(' · ');
        return '<div class="swatch"><div class="chip" style="background:var(--' + esc(t.name) + ')"></div><div class="meta"><b>' + esc(t.name) + '</b><span class="val">' + esc(vals) + '</span><span class="use">' + esc(t.usage || '') + '</span></div></div>';
      }).join('') + '</div>' + pager('/colours');
  }

  function pageType() {
    var T = data.tokens;
    return head('Foundations', 'Type', 'Fraunces for display, Manrope for everything else.') +
      T.type.groups.map(function (g) {
        return '<h2 class="sec">' + esc(g.name) + '</h2>' + g.styles.map(function (s) {
          return '<div class="typerow"><div><b>' + esc(s.name) + '</b><div class="spec">' + esc(s.fontSize + ' / ' + s.lineHeight + ' · ' + s.fontWeight) + '</div></div><div><div class="' + esc(s.name) + '">' + esc(s.sample || 'Warm earth, one sharp yellow') + '</div><div class="spec">' + esc(s.usage || '') + '</div></div></div>';
        }).join('');
      }).join('') + pager('/type');
  }

  function pageSpace() {
    var T = data.tokens, sh = T.shadow || { tokens: [] };
    return head('Foundations', 'Space, shape & elevation', '') +
      '<h2 class="sec">Spacing</h2>' + T.spacing.tokens.map(function (t) {
        return '<div class="scalerow"><b>' + esc(t.name) + '</b><span class="muted">' + esc(t.value) + '</span><div><div class="bar" style="width:' + esc(t.value) + '"></div></div></div>';
      }).join('') +
      '<h2 class="sec">Radius</h2><div class="radii">' + T.radius.tokens.map(function (t) {
        return '<div class="radius"><div class="shape" style="border-radius:' + esc(t.value) + '"></div><b>' + esc(t.name) + '</b><div class="muted">' + esc(t.value) + '</div></div>';
      }).join('') + '</div>' +
      '<h2 class="sec">Elevation</h2><p class="muted">' + esc(sh.note || '') + '</p><div class="shadows">' + sh.tokens.map(function (t) {
        return '<div class="shadow"><div class="layer" style="box-shadow:var(--' + esc(t.name) + ')"></div><b>' + esc(t.name) + '</b><div class="spec">' + esc(t.usage || '') + '</div></div>';
      }).join('') + '</div>' + pager('/space');
  }

  function pageAssets() {
    var ix = data.index || {}, gs = ix.groups || Object.keys(ix.assetGroups || {});
    return head('Foundations', 'Logos & icons', 'Click any tile to download it.') + gs.map(function (g) {
      var G = (ix.assetGroups || {})[g]; if (!G) return '';
      return '<div class="agroup"><h2 class="sec">' + esc(G.name) + ' <span class="muted" style="font-family:var(--font-sans);font-size:15px">' + (G.order || []).length + '</span></h2><div class="atiles ' + esc(G.tile || 'l') + '">' + (G.order || []).map(function (n) {
        var url = 'assets/' + encodeURIComponent(g) + '/' + n.split('/').map(encodeURIComponent).join('/');
        return '<a class="atile' + (/-dark\./.test(n) ? ' dark' : '') + '" href="' + url + '" download><div class="pic"><img src="' + url + '" alt="' + esc(n) + '" loading="lazy"></div><div class="cap">' + esc(n.replace(/\.svg$/, '')) + '</div></a>';
      }).join('') + '</div></div>';
    }).join('') + pager('/assets');
  }

  function pageComponent(name) {
    var c = data.comps.filter(function (x) { return x.name === name; })[0];
    if (!c) return head('Not found', 'No component called ' + name, '<a href="#/">Back to the overview</a>');
    return '<div id="comp-page">' + head(c.group || 'Component', c.name, '') + '<div class="loading">Loading ' + esc(c.name) + '…</div></div>' + pager('/c/' + name);
  }
  function fillComponent(name) {
    var c = data.comps.filter(function (x) { return x.name === name; })[0];
    if (!c) return;
    Promise.all([get('components/' + name + '/preview.html'), get('components/' + name + '/README.md').catch(function () { return ''; })]).then(function (r) {
      if (currentRoute() !== '/c/' + name) return;
      var html = r[0], md = r[1], m = marker(html);
      data.previews[name] = html;
      var wrap = document.getElementById('comp-page');
      wrap.innerHTML = head(m.group || 'Component', name, mdInline(summary(md))) +
        '<div class="stage"><div class="stage-bar"><span>' + esc(m.subtitle || 'Live preview') + '</span><button class="wt-btn wt-btn-ghost wt-btn-sm" type="button" id="replay">Reset preview</button></div>' +
        '<iframe id="frame" title="' + esc(name) + ' preview" style="height:' + m.height + 'px"></iframe></div>' +
        '<div class="prose" style="margin-top:var(--space-6)">' + marked.parse(md.replace(/^#.*\n+/, '').replace(/^[^\n]*\n+/, '')) + '</div>';
      loadFrame();
      document.getElementById('replay').onclick = loadFrame;
    });
  }
  function loadFrame() {
    var route = currentRoute(), f = document.getElementById('frame');
    if (f && route.indexOf('/c/') === 0) f.srcdoc = srcdoc(data.previews[route.slice(3)]);
    var cv = document.getElementById('cover');
    if (cv) get('components/Cover/preview.html').then(function (h) { cv.srcdoc = srcdoc(h); fitCover(); });
  }
  function fitCover() {
    var box = document.getElementById('cover-box'), f = document.getElementById('cover');
    if (!box || !f) return;
    var s = Math.min(1, box.clientWidth / 960);
    f.style.transform = 'scale(' + s + ')'; box.style.height = (300 * s) + 'px';
  }

  /* ---------- router ---------- */
  function currentRoute() { var h = location.hash.replace(/^#/, ''); return h || '/'; }
  var titles = { '/': 'Overview', '/start': 'Using Wattle', '/brand': 'Brand book', '/colours': 'Colours', '/type': 'Type', '/space': 'Space, shape & elevation', '/assets': 'Logos & icons' };
  function route() {
    var r = currentRoute(), main = document.getElementById('main'), html;
    if (r === '/') html = pageOverview();
    else if (r === '/start') html = pageStart();
    else if (r === '/brand') html = pageBrand();
    else if (r === '/colours') html = pageColours();
    else if (r === '/type') html = pageType();
    else if (r === '/space') html = pageSpace();
    else if (r === '/assets') html = pageAssets();
    else if (r.indexOf('/c/') === 0) html = pageComponent(decodeURIComponent(r.slice(3)));
    else html = head('Not found', 'Page not found', '<a href="#/">Back to the overview</a>');
    main.innerHTML = '<div class="page">' + html + '</div>';
    document.title = (titles[r] || decodeURIComponent(r.replace('/c/', ''))) + ' — Wattle';
    if (r.indexOf('/c/') === 0) fillComponent(decodeURIComponent(r.slice(3)));
    if (r === '/') loadFrame();
    if (r === '/start') document.getElementById('copy-tokens').onclick = function (e) {
      var b = e.currentTarget;
      try { navigator.clipboard.writeText(tokensCss()).then(function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy'; }, 1800); }); } catch (x) {}
    };
    if (r === '/brand') main.querySelectorAll('[data-jump]').forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        var t = a.getAttribute('data-jump');
        var hs = Array.prototype.filter.call(document.querySelectorAll('#brand-prose h2'), function (x) { return x.textContent.trim() === t; });
        if (hs[0]) hs[0].scrollIntoView({ behavior: 'smooth' });
      });
    });
    renderNav();
    window.scrollTo(0, 0);
    main.focus({ preventScroll: true });
    document.body.classList.remove('nav-open');
    document.getElementById('menu-btn').setAttribute('aria-expanded', 'false');
  }

  /* ---------- boot ---------- */
  get('design-system.json').then(function (t) { data.index = JSON.parse(t); V = (data.index.lastChange && data.index.lastChange.at || '').replace(/\D/g, ''); }).catch(function () {})
    .then(function () { return Promise.all([get('tokens.json'), get('README.md'), get('components/bundle.js')]); })
    .then(function (r) {
      data.tokens = JSON.parse(r[0]); data.readme = r[1];
      var hm = /@ds-bundle:\s*(\{.*?\})\s*\*\//.exec(r[2]);
      var names = hm ? JSON.parse(hm[1]).components.map(function (c) { return c.name; }) : [];
      document.getElementById('tokens-css').textContent = tokensCss();
      return Promise.all(names.map(function (n) {
        return get('components/' + n + '/preview.html').then(function (h) { var m = marker(h); return { name: n, group: m.group, subtitle: m.subtitle }; }, function () { return { name: n, group: 'Other' }; });
      }));
    })
    .then(function (comps) { data.comps = comps; route(); })
    .catch(function (e) { document.getElementById('main').innerHTML = '<div class="page">Could not load Wattle: ' + esc(e.message) + '</div>'; });

  window.addEventListener('hashchange', function () { if (data.tokens) route(); });
  window.addEventListener('resize', fitCover);
  document.getElementById('search').addEventListener('input', renderNav);
  document.getElementById('search').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { var a = document.querySelector('#nav .nav-link'); if (a) location.hash = a.getAttribute('href'); }
    if (e.key === 'Escape') { e.target.value = ''; renderNav(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') { e.preventDefault(); document.getElementById('search').focus(); }
  });
  var menu = document.getElementById('menu-btn');
  menu.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>';
  menu.addEventListener('click', function () { var open = document.body.classList.toggle('nav-open'); menu.setAttribute('aria-expanded', String(open)); });
  document.getElementById('theme').addEventListener('click', function (e) {
    theme = theme === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
    e.currentTarget.setAttribute('aria-pressed', String(theme === 'dark'));
    e.currentTarget.textContent = theme === 'light' ? 'Dark theme' : 'Light theme';
    document.getElementById('brand-logo').src = theme === 'dark' ? 'assets/Logos/wattle-lockup-dark.svg' : 'assets/Logos/wattle-lockup.svg';
    loadFrame();
  });
})();
</script>
</body>
</html>
