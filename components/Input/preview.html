<!-- @dsCard group="Forms" height=240 subtitle="Default, with hint, with error, with icons" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Input</title><style>body{margin:0;background:var(--surface-100);color:var(--ink);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:center;padding:var(--space-4)}</style><style>.row{align-items:flex-start}.row>*{width:240px}</style></head>
<body>
<div id="root"></div>
<script>
  var W = window.Wattle, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', { className: 'row' },
      h(W.Input, { label: 'Course name', placeholder: 'e.g. Physics for Class 12' }),
      h(W.Input, { label: 'Email', type: 'email', placeholder: 'name@school.in', hint: "We'll send the invite here." }),
      h(W.Input, { label: 'Batch code', defaultValue: 'PHY 12', error: 'Use letters and numbers only, no spaces.' })),
    h('div', { className: 'row' },
      h(W.Input, { label: 'Search courses', icon: 'search', placeholder: 'Search' }),
      h(W.Input, { label: 'Start date', iconEnd: 'calendar', placeholder: 'DD/MM/YYYY' }),
      h(W.Input, { label: 'Filter students', icon: 'filter', iconEnd: 'chevron-down', placeholder: 'All batches' }))));
</script>
</body>
</html>
