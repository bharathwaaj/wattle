<!-- @dsCard group="Media" height=190 subtitle="The 24 starter icons, at 24px in ink" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon</title><style>body{margin:0;background:var(--surface-100);color:var(--ink);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:center;padding:var(--space-4)}</style><style>.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:var(--space-2);padding:var(--space-4)}.cell{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;line-height:14px;color:var(--ink-muted);text-align:center}.cell .wt-icon{color:var(--ink)}</style></head>
<body>
<div id="root"></div>
<script>
  var W = window.Wattle, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'grid' }, W.Icon.names.map(function (n) {
      return h('div', { className: 'cell', key: n }, h(W.Icon, { name: n }), n);
    })));
</script>
</body>
</html>
