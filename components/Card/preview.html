<!-- @dsCard group="Layout" height=1400 width=960 subtitle="Eleven card patterns built from Wattle parts: try Book, Reserve, Save" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Card</title>
<style>
  body { margin: 0; background: var(--surface-100); color: var(--ink); font-family: var(--font-sans); }
  .bento { display: flex; flex-direction: column; gap: var(--space-6); padding: var(--space-6); }
  .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); align-items: start; }
  .col { display: flex; flex-direction: column; gap: var(--space-6); }
  figure { margin: 0; display: flex; flex-direction: column; gap: var(--space-2); }
  figcaption { font-size: 12px; line-height: 16px; color: var(--ink-muted); }
  figcaption b { color: var(--ink); font-weight: 700; }
  .wide .wt-card-empty { padding: var(--space-6); }
  /* layout glue only: every visual piece below is a Wattle component */
  .row { display: flex; gap: var(--space-4); align-items: flex-start; }
  .row-center { display: flex; gap: var(--space-4); align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .h4 { margin: 0 0 6px; font-family: var(--font-display); font-size: 20px; line-height: 26px; font-weight: 600; color: var(--ink); }
  .notice-title { margin: 0 0 4px; font-size: 16px; line-height: 22px; font-weight: 700; color: var(--ink); }
  .muted { font-size: 12px; color: var(--ink-muted); }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .cta { margin-top: var(--space-2); display: inline-flex; align-items: center; gap: var(--space-1); font-weight: 700; color: var(--ink); }
  a.wt-card:hover .cta { text-decoration: underline; text-underline-offset: 3px; }
  a.wt-card:hover .cta .wt-icon, a.wt-card:focus-visible .cta .wt-icon { animation: wt-nudge 520ms ease; }
  @media (prefers-reduced-motion: reduce) { .cta .wt-icon { animation: none !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var W = window.Wattle, h = React.createElement, F = React.Fragment;
  function later(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function Fig(props) {
    return h('figure', { className: props.className }, props.children,
      h('figcaption', null, h('b', null, props.kind), ' · ', props.why));
  }

  function cover() {
    return h('svg', { viewBox: '0 0 300 160', role: 'img', 'aria-label': 'Cover: a lapwing eye ring over a dry field' },
      h('rect', { width: 300, height: 160, style: { fill: 'var(--earth)' } }),
      h('path', { d: 'M0 112 C60 86 120 122 180 100 S270 86 300 104 V160 H0Z', style: { fill: 'var(--taupe)' } }),
      h('path', { d: 'M0 134 C80 114 160 146 300 128 V160 H0Z', style: { fill: 'var(--wing)' } }),
      h('circle', { cx: 210, cy: 60, r: 34, style: { fill: '#1F1D1B' } }),
      h('circle', { cx: 210, cy: 60, r: 18, style: { fill: 'none', stroke: 'var(--wattle)', strokeWidth: 8 } }),
      h('circle', { cx: 210, cy: 60, r: 6, style: { fill: 'var(--wattle)' } }));
  }

  /* Announcement = IconDisc + text + icon-only Button */
  var announcement = h(Fig, { kind: 'Announcement', why: 'IconDisc (strong), message, time; dismissible', className: 'wide' },
    h(W.Card, null,
      h('div', { className: 'row' },
        h(W.IconDisc, { icon: 'bell', tone: 'strong' }),
        h('div', { className: 'grow' },
          h('h4', { className: 'notice-title' }, 'No classes on Monday, 24 November'),
          h('p', { style: { margin: '0 0 6px' } }, 'The campus is closed for the state holiday. Recorded lessons stay open, and Tuesday’s live classes run as usual.'),
          h('span', { className: 'muted' }, '2 hours ago · Admin office')),
        h(W.Button, { variant: 'ghost', size: 'sm', icon: 'x', 'aria-label': 'Dismiss' }))));

  /* Event = DateBlock + MetaList + ActionButton (flip) */
  var event = h(Fig, { kind: 'Event', why: 'DateBlock + MetaList; Add to calendar flips' },
    h(W.Card, { footer: h(W.ActionButton, { animation: 'flip', variant: 'secondary', size: 'sm', icon: 'calendar', label: 'Add to calendar', doneLabel: 'Added to calendar', onAction: function () { return later(300); } }) },
      h('div', { className: 'row' },
        h(W.DateBlock, { month: 'NOV', day: 18, label: 'Tuesday 18 November' }),
        h('div', { className: 'grow' }, h('h4', { className: 'h4' }, 'Live class: Wave optics'),
          h(W.MetaList, { items: [{ icon: 'clock', text: 'Tue · 6:00–7:30 pm' }, { icon: 'user', text: 'Ms. Anitha · Online' }] })))));

  /* Booking = Badge + MetaList + ActionButton (morph, undoable) */
  function Booking() {
    var st = React.useState(8), places = st[0], setPlaces = st[1];
    return h(W.Card, { eyebrow: h(F, null, h(W.Badge, { tone: 'strong' }, 'New'), h(W.Badge, null, 'Beginner')), title: 'Saturday doubt-clearing hour',
      footer: h(F, null,
        h(W.ActionButton, { size: 'sm', icon: 'plus', label: 'Book', doneLabel: 'Booked', undoable: true, undoHint: 'Click to cancel your booking',
          onAction: function () { return later(900).then(function () { setPlaces(7); }); }, onUndo: function () { setPlaces(8); } }),
        h(W.Button, { variant: 'ghost', size: 'sm' }, 'Details')) },
      h('p', null, 'A relaxed hour for Class 11 students, with time for any question at the end.'),
      h(W.MetaList, { items: [{ icon: 'calendar', text: 'Every Saturday' }, { icon: 'clock', text: '9:30 to 10:30 am' },
        { icon: 'user', text: h('span', { key: places, className: 'wt-stat-num' }, places + ' places left') }] }));
  }
  var booking = h(Fig, { kind: 'Booking', why: 'Badge + MetaList; Book latches to Booked, click again to cancel' }, h(Booking));

  /* Progress = Progress + Button (nudge) */
  var progress = h(Fig, { kind: 'Progress', why: 'Progress bar; hover Resume and the arrow nudges' },
    h(W.Card, { eyebrow: 'Continue learning', title: 'Organic Chemistry', divider: false, footer: h(W.Button, { size: 'sm', iconEnd: 'arrow-right', effect: 'nudge' }, 'Resume lesson 13') },
      h(W.Progress, { value: 12, max: 24, label: 'Organic Chemistry progress' }),
      h('p', null, '12 of 24 lessons · Next: Alkenes')));

  /* Media = media prop + ReactionButton (bookmark) */
  var media = h(Fig, { kind: 'Media', why: 'a full-bleed cover; the bookmark drops in when saved' },
    h(W.Card, { media: cover(), eyebrow: 'Field guide', title: 'Birds of the Deccan',
      footer: h(F, null, h(W.Button, { size: 'sm', icon: 'book-open' }, 'Read'), h(W.ReactionButton, { kind: 'bookmark', label: 'Save to my library' })) },
      h('p', null, 'A plain guide to the ground birds of dry fields, from lapwings to larks.'),
      h('span', { className: 'muted', style: { fontSize: 13 } }, '214 pages · 12 chapters')));

  /* Checklist = Checklist with a live count in the eyebrow */
  function Todo() {
    var st = React.useState([true, true, true, false, false]), done = st[0], set = st[1];
    return h(W.Card, { eyebrow: done.filter(Boolean).length + ' of 5 done', title: 'Before the exam' },
      h(W.Checklist, { label: 'Before the exam', done: done, onChange: set, items: [
        { label: 'Revise chapters 1–4' }, { label: 'Finish mock test 3' }, { label: 'Pack admit card' }, { label: 'Sleep by 10 pm' }, { label: 'Reach the centre by 8:30' }] }));
  }
  var checklist = h(Fig, { kind: 'Checklist', why: 'Checklist; the count updates as you tick' }, h(Todo));

  var link = h(Fig, { kind: 'Link', why: 'the whole card is the link; no buttons inside' },
    h(W.Card, { as: 'a', href: '#', title: 'See the full timetable' },
      h('p', null, 'Every class for the next four weeks, with the places still open.'),
      h('span', { className: 'cta' }, 'Open timetable', h(W.Icon, { name: 'arrow-right', size: 16 }))));

  /* Availability = Stat + SeatMap + ActionButton (morph, undoable) */
  function Availability() {
    var st = React.useState(36), taken = st[0], setTaken = st[1];
    return h(W.Card, { eyebrow: 'Weekend batch · starts 1 Dec', title: 'JEE crash course',
      footer: h(W.ActionButton, { variant: 'secondary', size: 'sm', label: 'Reserve a seat', doneLabel: 'Seat reserved', undoable: true, undoHint: 'Click to give your seat back',
        onAction: function () { return later(800).then(function () { setTaken(37); }); }, onUndo: function () { setTaken(36); } }) },
      h(W.Stat, { value: 40 - taken, unit: 'seats left' }),
      h(W.SeatMap, { total: 40, taken: taken, mine: taken > 36 }));
  }
  var availability = h(Fig, { kind: 'Availability', why: 'Stat + SeatMap; reserve and your seat fills in' }, h(Availability));

  /* Metric = Stat + Sparkline */
  var metric = h(Fig, { kind: 'Metric', why: 'Stat with a trend, and a Sparkline' },
    h(W.Card, { eyebrow: 'Average test score · 8 weeks' },
      h(W.Stat, { value: '86%', trend: 'Up 4 points on last week' }),
      h(W.Sparkline, { data: [62, 70, 66, 74, 71, 79, 82, 86], label: 'Average score over 8 weeks, from 62 to 86' })));

  /* Person = Avatar + Status + Badge */
  var person = h(Fig, { kind: 'Person', why: 'Avatar, Status, and a row of Badges' },
    h(W.Card, { divider: false, footer: h(F, null, h(W.Button, { size: 'sm' }, 'Message'), h(W.Button, { variant: 'ghost', size: 'sm', icon: 'calendar' }, 'Book a slot')) },
      h('div', { className: 'row-center' },
        h(W.Avatar, { name: 'Anitha Rao', size: 56 }),
        h('div', null, h('h4', { className: 'h4', style: { margin: 0 } }, 'Anitha Rao'), h(W.Status, { tone: 'live' }, 'Teaching now'))),
      h('div', { className: 'badges' }, h(W.Badge, null, 'Physics'), h(W.Badge, null, 'Batch A'), h(W.Badge, null, 'Batch C'))));

  var empty = h(Fig, { kind: 'Empty state', why: 'the dashed empty variant invites the first step', className: 'wide' },
    h(W.Card, { variant: 'empty', icon: 'plus', title: 'No tests yet', footer: h(W.Button, { size: 'sm', icon: 'plus' }, 'Create a test') },
      'Tests you create for this batch will show up here.'));

  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'bento' },
      announcement,
      h('div', { className: 'cols' },
        h('div', { className: 'col' }, event, booking, progress),
        h('div', { className: 'col' }, media, checklist, link),
        h('div', { className: 'col' }, availability, metric, person)),
      empty));
</script>
</body>
</html>
