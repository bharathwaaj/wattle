<!-- @dsCard group="Layout" height=840 width=960 subtitle="Three jobs: show an item, lead somewhere, offer a choice" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Card</title>
<style>
  body { margin: 0; background: var(--surface-100); color: var(--ink); font-family: var(--font-sans); }
  .page { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-10); }
  .kind-head { display: flex; flex-direction: column; gap: var(--space-1); margin-bottom: var(--space-4); }
  .kind-name { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
  .kind-why { font-size: 14px; line-height: 20px; color: var(--ink); }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); }
  .stat { font-family: var(--font-display); font-size: 24px; line-height: 30px; font-weight: 600; color: var(--ink); }
  .price { font-family: var(--font-display); font-size: 28px; line-height: 34px; font-weight: 600; color: var(--ink); }
  .price small { font-family: var(--font-sans); font-size: 14px; font-weight: 500; color: var(--ink-muted); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var W = window.Wattle, h = React.createElement, F = React.Fragment;

  function Kind(props) {
    return h('section', null,
      h('div', { className: 'kind-head' },
        h('span', { className: 'kind-name' }, props.name),
        h('span', { className: 'kind-why' }, props.why)),
      h('div', { className: 'grid', role: props.role, 'aria-label': props.label }, props.children));
  }

  function actions() {
    return h(F, null, h(W.Button, { variant: 'primary', size: 'sm' }, 'Open'), h(W.Button, { variant: 'ghost', size: 'sm', icon: 'upload' }, 'Share'));
  }

  function Plans() {
    var s = React.useState('yearly'), sel = s[0], set = s[1];
    var plans = [
      { id: 'monthly', name: 'Monthly', price: '₹499', per: '/ month', note: 'Cancel any time. Good for trying it out.' },
      { id: 'yearly', name: 'Yearly', price: '₹4,999', per: '/ year', note: 'Two months free. Every course included.' },
      { id: 'school', name: 'School', price: 'Custom', per: '', note: 'For whole batches, with a teacher dashboard.' }
    ];
    return h(Kind, { name: 'Choice cards', why: 'Offer one option among a few. Click to pick; the chosen card gets an ink border, never a yellow fill.', role: 'radiogroup', label: 'Plan' },
      plans.map(function (p) {
        var on = sel === p.id;
        return h(W.Card, { key: p.id, as: 'button', role: 'radio', 'aria-checked': on, selected: on, onClick: function () { set(p.id); },
          eyebrow: on ? h(F, null, h(W.Icon, { name: 'check', size: 14 }), p.name + ' · Selected') : p.name },
          h('div', { className: 'price' }, p.price, ' ', h('small', null, p.per)), p.note);
      }));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'page' },
      h(Kind, { name: 'Content cards', why: 'Show one item, like a course or a test, with what you can do next. No icon: the title does the work.' },
        h(W.Card, { eyebrow: 'Course', title: 'Physics for Class 12', footer: actions() }, '24 lessons and 6 practice tests. Updated 3 days ago.'),
        h(W.Card, { eyebrow: 'Course', title: 'Organic Chemistry', footer: actions() }, '18 lessons and 4 practice tests. Updated last week.'),
        h(W.Card, { eyebrow: 'Test series', title: 'JEE Main mock tests', footer: actions() }, '10 full-length tests with answer keys.')),
      h(Kind, { name: 'Shortcut cards', why: 'Lead to a section of the app. The icon helps people find it fast, and the whole card is the link.' },
        h(W.Card, { as: 'a', href: '#', icon: 'book-open', title: 'Library' }, h('div', { className: 'stat' }, '128'), 'books and notes'),
        h(W.Card, { as: 'a', href: '#', icon: 'calendar', title: 'Schedule' }, h('div', { className: 'stat' }, '3'), 'live classes today'),
        h(W.Card, { as: 'a', href: '#', icon: 'user', title: 'Students' }, h('div', { className: 'stat' }, '412'), 'enrolled across 9 batches')),
      h(Plans)));
</script>
</body>
</html>
