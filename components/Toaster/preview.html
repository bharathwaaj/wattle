<!-- @dsCard group="Overlays" height=230 subtitle="Call Wattle.toast() anywhere" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Toaster</title><style>body{margin:0;background:var(--surface-100);color:var(--ink);font-family:var(--font-sans)}.pad{padding:var(--space-4)}.stack{display:flex;flex-direction:column;gap:var(--space-4);max-width:360px}.row{display:flex;flex-wrap:wrap;gap:var(--space-6);align-items:flex-start}</style></head>
<body>
<div id="root"></div>
<script>
  var W = window.Wattle, h = React.createElement, F = React.Fragment;
  ReactDOM.createRoot(document.getElementById("root")).render(h("div", { className: "pad row" },
    h(W.Button, { icon: "check", onClick: function () { W.toast("Changes saved", { tone: "success" }); } }, "Save changes"),
    h(W.Button, { icon: "trash-2", onClick: function () { W.toast("Lesson moved to bin", { actionLabel: "Undo", onAction: function () { W.toast("Lesson restored"); } }); } }, "Delete lesson"),
    h(W.Button, { variant: "ghost", onClick: function () { W.toast("Couldn't reach the server", { tone: "danger", actionLabel: "Retry" }); } }, "Fail"),
    h(W.Toaster)));
</script>
</body>
</html>
