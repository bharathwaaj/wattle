<!-- @dsCard group="Actions" height=290 subtitle="Variants, sizes, icons, icon-only, hover effects" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button</title><style>body{margin:0;background:var(--surface-100);color:var(--ink);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:center;padding:var(--space-4)}</style></head>
<body>
<div id="root"></div>
<script>
  var W = window.Wattle, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', { className: 'row' },
      h(W.Button, { variant: 'primary' }, 'Create course'),
      h(W.Button, null, 'Preview'),
      h(W.Button, { variant: 'ghost' }, 'Cancel'),
      h(W.Button, { variant: 'danger' }, 'Delete course')),
    h('div', { className: 'row' },
      h(W.Button, { variant: 'primary', icon: 'plus' }, 'Add student'),
      h(W.Button, { icon: 'download' }, 'Export'),
      h(W.Button, { variant: 'ghost', iconEnd: 'arrow-right' }, 'Next lesson'),
      h(W.Button, { variant: 'danger', icon: 'trash-2' }, 'Delete')),
    h('div', { className: 'row' },
      h(W.Button, { variant: 'primary', size: 'sm', icon: 'check' }, 'Save'),
      h(W.Button, { size: 'sm', icon: 'pencil' }, 'Edit'),
      h(W.Button, { icon: 'search', 'aria-label': 'Search' }),
      h(W.Button, { variant: 'ghost', icon: 'settings', 'aria-label': 'Settings' }),
      h(W.Button, { variant: 'ghost', size: 'sm', icon: 'x', 'aria-label': 'Close' }),
      h(W.Button, { variant: 'primary', disabled: true }, 'Publishing…')),
    h('div', { className: 'row' },
      h(W.Button, { effect: 'nudge', iconEnd: 'arrow-right' }, 'Next lesson (hover: nudge)'),
      h(W.Button, { effect: 'sweep', iconEnd: 'chevron-right' }, 'View all courses (hover: sweep)'))));
</script>
</body>
</html>
