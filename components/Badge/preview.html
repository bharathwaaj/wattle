<!doctype html>
<html>
<head><meta charset="utf-8"><title>Badge</title><style>body{margin:0;background:var(--surface-100);color:var(--ink);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;padding:var(--space-4)}</style></head>
<body>
<div id="root"></div>
<script>
  var W = window.Wattle, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'row' },
      h(W.Badge, null, 'Beginner'),
      h(W.Badge, null, 'Batch A'),
      h(W.Badge, { icon: 'clock' }, '60 min'),
      h(W.Badge, { tone: 'strong' }, 'New'),
      h(W.Badge, { tone: 'danger', icon: 'triangle-alert' }, 'Overdue')));
</script>
</body>
</html>
